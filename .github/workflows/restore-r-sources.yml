name: Restore R sources

on:
  push:
    paths:
      - 'source_bundle/part07.b64'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source_bundle/part*.b64 | base64 --decode > /tmp/project_source.zip
          mkdir -p /tmp/project_source R
          unzip -o /tmp/project_source.zip -d /tmp/project_source
          cp /tmp/project_source/*.R R/

      - name: Commit restored R scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/
          if git diff --cached --quiet; then
            echo "No R source changes to commit."
          else
            git commit -m "Restore research R scripts"
            git push
          fi
