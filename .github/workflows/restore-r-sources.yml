name: Restore R sources

on:
  push:
    paths:
      - 'source_bundle/part07.b64'
      - 'source_bundle/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble source bundle
        shell: bash
        run: |
          set -euo pipefail

          # Parts 01-06 were originally 20,000 base64 characters each.
          # Some GitHub transfer writes accidentally appended extra characters
          # to parts 03, 04 and 06. The correct source is the first 20,000
          # characters of every non-final part; part07 is the final remainder.
          {
            for i in 01 02 03 04 05 06; do
              head -c 20000 "source_bundle/part${i}.b64"
            done
            cat source_bundle/part07.b64
          } | base64 --decode > /tmp/project_source.zip

          rm -rf /tmp/project_source
          mkdir -p /tmp/project_source R
          unzip -o /tmp/project_source.zip -d /tmp/project_source

          count=$(find /tmp/project_source -maxdepth 2 -type f -name '*.R' | wc -l)
          echo "Recovered R files: $count"
          find /tmp/project_source -maxdepth 2 -type f -name '*.R' -print
          test "$count" -eq 7
          find /tmp/project_source -maxdepth 2 -type f -name '*.R' -exec cp {} R/ \;

      - name: Commit restored R scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/
          if git diff --cached --quiet; then
            echo "No R source changes to commit."
          else
            git commit -m "Restore research R scripts"
            git push
          fi
