name: Fix EWMA timing benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-ewma-timing.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct EWMA origin timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('R/btc_one_day_strategy_lab.R')
          s = p.read_text(encoding='utf-8')
          a = '# EWMA RV benchmark: at t, forecast t+1 from information through t.'
          b = '# EWMA RV benchmark: at origin t, forecast t+1 using information through t.'
          old1 = 'if(is.finite(px$rv_actual[i-1]) && is.finite(ew[i-1])) {'
          new1 = 'if(is.finite(px$rv_actual[i]) && is.finite(ew[i-1])) {'
          old2 = 'ew[i] <- cfg$ewma_lambda*ew[i-1] + (1-cfg$ewma_lambda)*px$rv_actual[i-1]'
          new2 = 'ew[i] <- cfg$ewma_lambda*ew[i-1] + (1-cfg$ewma_lambda)*px$rv_actual[i]'
          for old in (a, old1, old2):
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old}')
          s = s.replace(a, b).replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/btc_one_day_strategy_lab.R
          git rm .github/workflows/fix-ewma-timing.yml
          git commit -m "Fix EWMA benchmark timing at forecast origin"
          git push