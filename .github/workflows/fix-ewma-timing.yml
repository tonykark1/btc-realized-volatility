name: Fix EWMA timing benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ewma-timing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct EWMA origin timing
        shell: python
        run: |
          from pathlib import Path
          p = Path('R/btc_one_day_strategy_lab.R')
          s = p.read_text(encoding='utf-8')
          old = '''# EWMA RV benchmark: at t, forecast t+1 from information through t.
ew <- rep(NA_real_,nrow(px))
first <- which(is.finite(px$rv_actual))
if(length(first)<60) stop("Too little realized RV history.")
j0 <- first[60]
ew[j0] <- mean(px$rv_actual[first[1:60]],na.rm=TRUE)
if(j0<nrow(px)) for(i in (j0+1L):nrow(px)) {
  if(is.finite(px$rv_actual[i-1]) && is.finite(ew[i-1])) {
    ew[i] <- cfg$ewma_lambda*ew[i-1] + (1-cfg$ewma_lambda)*px$rv_actual[i-1]
  } else ew[i] <- ew[i-1]
}
px$ewma_rv <- ew'''
          new = '''# EWMA RV benchmark: at origin t, forecast t+1 using information through t.
ew <- rep(NA_real_,nrow(px))
first <- which(is.finite(px$rv_actual))
if(length(first)<60) stop("Too little realized RV history.")
j0 <- first[60]
ew[j0] <- mean(px$rv_actual[first[1:60]],na.rm=TRUE)
if(j0<nrow(px)) for(i in (j0+1L):nrow(px)) {
  # At origin t = i, RV_t is already observed. The t+1 benchmark therefore
  # updates with current realized variance RV_t, not stale RV_{t-1}.
  if(is.finite(px$rv_actual[i]) && is.finite(ew[i-1])) {
    ew[i] <- cfg$ewma_lambda*ew[i-1] + (1-cfg$ewma_lambda)*px$rv_actual[i]
  } else ew[i] <- ew[i-1]
}
px$ewma_rv <- ew'''
          if old not in s:
              raise SystemExit('Expected stale EWMA block not found; refusing to edit')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit correction and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/btc_one_day_strategy_lab.R
          git rm .github/workflows/fix-ewma-timing.yml
          git commit -m "Fix EWMA benchmark timing at forecast origin"
          git push