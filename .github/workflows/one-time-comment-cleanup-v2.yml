name: One-time comment cleanup v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-comment-cleanup-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reduce comments to navigation and non-obvious assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('R/btc_binance_realized_vol_horserace.R'),
              Path('R/btc_one_day_strategy_lab.R'),
              Path('R/btc_rv_horserace_visuals.R'),
          ]

          heading_re = re.compile(r'^#\s*\d+(?:\.\d+)*\.?\s+\S')
          important = (
              'information available through', 'at origin t', 't->t+1',
              't -> t+1', 'purged', 'purge', 'look-ahead', 'lookahead',
              'microseconds', 'normalize internal timestamps', 'range guard',
              'passively drifted', 'common-volatility', 'ex-post',
              'realizedfor'
          )

          def strip_inline_comment(line: str) -> str:
              if line.lstrip().startswith('#'):
                  return line
              quote = None
              escape = False
              for i, ch in enumerate(line):
                  if escape:
                      escape = False
                      continue
                  if ch == '\\' and quote is not None:
                      escape = True
                      continue
                  if quote is not None:
                      if ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      continue
                  if ch == '#':
                      return line[:i].rstrip()
              return line.rstrip()

          def keep_full_comment(line: str, first_comment_kept: bool) -> bool:
              s = line.strip()
              body = s.lstrip('#').strip()
              low = body.lower()
              if not body:
                  return False
              if not first_comment_kept and low.startswith('btc '):
                  return True
              if heading_re.match(s):
                  return True
              if any(k in low for k in important) and len(body.split()) >= 6:
                  return True
              return False

          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              before_comments = sum(1 for x in lines if x.lstrip().startswith('#'))
              out = []
              first_comment_kept = False
              for raw in lines:
                  line = strip_inline_comment(raw)
                  if line.lstrip().startswith('#'):
                      if not keep_full_comment(line, first_comment_kept):
                          continue
                      first_comment_kept = True
                  if line.strip() == '' and out and out[-1].strip() == '':
                      continue
                  out.append(line)
              while out and out[-1].strip() == '':
                  out.pop()
              path.write_text('\n'.join(out) + '\n', encoding='utf-8')
              after_comments = sum(1 for x in out if x.lstrip().startswith('#'))
              print(f'{path}: full-line comments {before_comments} -> {after_comments}; lines {len(lines)} -> {len(out)}')
          PY

      - name: Check diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/btc_binance_realized_vol_horserace.R R/btc_one_day_strategy_lab.R R/btc_rv_horserace_visuals.R
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reduce code comments to essentials"
            git push
          fi
